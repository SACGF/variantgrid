{% load static %}
{% load user_tag_color_tags %}
{% render_tag_styles_and_formatter %}
<style>
    {% render_node_count_colors_css %}

    #sample-variants-downloads {
        display: none;
        margin-bottom: 5px;
        border-radius: 4px;
    }
</style>
<script type="text/javascript" src="{% static 'js/analysis_updates.js' %}"></script>
<div id='sample-variants-container'>
    {% include "messages/messages.html" %}

    {% if analysis %}
        <script>
        // Tags are shown read only here - they are added/removed in the analysis itself
        variantTags = {% render_variant_tags_dict analysis %};
        variantTagOrder = {% render_variant_tag_order %};
        variantTagsReadOnly = true;

        function gridLoadError() {
            console.log("gridLoadError");
        }

        function on_error_function() {
            console.log("on_error_function");
        }

        function showNodeGrid(nodeStatus) {
            let analysisId = {{ analysis.id }};
            let analysisVersion = {{ analysis.version }};
            let nodeId = nodeStatus.id;
            let version = nodeStatus.version;

            let config_url = Urls.node_grid_config(analysisId, analysisVersion, nodeId, version, "default");
            let handler_url = Urls.node_grid_handler(analysisId);
            let unique_code = "sample-variants-grid";  // ok to be constant on this page
            function noOp() {};
            setupNodeGrid(config_url, handler_url, analysisId, nodeId, version, unique_code,
                          noOp, gridLoadError, on_error_function);
        }

        $(document).ready(function() {
            // The CSV/VCF exports run as Celery jobs then hand back a file - see analysis_downloads.js
            analysisDownloadTracker = new AnalysisDownloadTracker({{ analysis.pk }}, "#sample-variants-downloads");

            let messagePoller = new AnalysisMessagePoller(Urls.nodes_status({{ analysis.pk }}));
            let gridContainer = $("#node-data-grid");

            $("#id_node").change(function() {
                let nodeId = $(this).val();
                gridContainer.empty();
                if (nodeId) {
                    $("<table/>").attr({
                        id: 'grid-' + nodeId,
                        class: 'grid'
                    }).appendTo(gridContainer);
                    messagePoller.observe_node(nodeId, "ready", showNodeGrid);
                }
            });
            messagePoller.update_loop();
        });
        </script>
        <h3>Analysis: {{ analysis }}</h3>
        {{ output_node_form.as_p }}

        <div id="sample-variants-downloads"></div>
        <div id="sample-variants-grid">
            <div id='node-data-grid' class='node-data'></div>
        </div>
    {% endif %}

</div>
