{% load ui_utils %}
{% if show %}
<style>
.genome-build-radio label {
    white-space: nowrap;
}
</style>
{% if table_id %}
<div id="{{ table_id }}-genome-build-filter" class="form-inline">
    {% labelled label="Genome Build" hint="inline" %}{% include "snpdb/tags/genome_build_radio.html" %}{% endlabelled %}
</div>
<script>
// The DataTables ajax `data` hook - data-datatable-data="genomeBuildGridFilter" on the table
function genomeBuildGridFilter(data, settings) {
    const genomeBuildName = $("#" + settings.sTableId).data("genomeBuildName");
    if (genomeBuildName) {
        data["genome_build_name"] = genomeBuildName;
    }
}

$(document).ready(function() {
    $("#{{ table_id }}-genome-build-filter input[name=genome_build_filter]").change(function() {
        const grid = $("#{{ table_id }}");
        grid.data("genomeBuildName", $(this).val());
        grid.DataTable().ajax.reload();
    });
});
</script>
{% else %}
    {% include "snpdb/tags/genome_build_radio.html" %}
{% endif %}
{% endif %}
