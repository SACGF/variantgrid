{% load static %}
{% load js_tags %}
<div class='wiki-tag'>
<script src="{% static 'js/lib/toastui/toastui-editor-all.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'js/lib/toastui/toastui-editor.min.css' %}" />
<script src="{% static 'js/snpdb/wiki_tag.js' %}"></script>
<script>
$(document).ready(function() {
    initWikiTag({
        wikiDomId: "wiki-{{ uuid }}",
        markdown: {{ wiki.markdown|jsonify }},
        hasWritePermission: {{ has_write_permission|jsonify }},
        exists: {{ wiki.pk|yesno:"true,false" }},
        className: {{ class_name|jsonify }},
        uniqueKeyword: {{ unique_keyword|jsonify }},
        uniqueValue: {{ unique_value|jsonify }},
    });
});
</script>

<div id='wiki-{{ uuid }}'>
    <div class="hidden editSection"></div>
    <span class='hidden saving-message'><i class="fa fa-spinner"></i> Saving...</span>
    <span class="hidden saved-message"></span>
    <button class='btn btn-outline-primary hidden wiki-save'>save wiki</button>
    {% if has_write_permission %}
        <a class='btn btn-outline-primary show-wiki-link' href="#">Create wiki entry</a>
    {% endif %}
</div>
</div>
