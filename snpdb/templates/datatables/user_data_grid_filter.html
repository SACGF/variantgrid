<div class="form-inline" id="user-data-filter-{{ table_id }}">
    {% if group_data %}
        <div class="form-check m-2">
            <label class="form-check-label">
                <input class="form-check-input" type="checkbox" data-filter-level="groups"
                       {% if user_grid_config.show_group_data %}checked{% endif %} />
                Show Group Data
            </label>
        </div>
    {% endif %}
    {% if hidden_data %}
        <div class="form-check m-2">
            <label class="form-check-label">
                <input class="form-check-input" type="checkbox" data-filter-level="hidden"
                       {% if user_grid_config.show_hidden_data %}checked{% endif %} />
                Show Hidden Data
            </label>
        </div>
    {% endif %}
</div>
<script>
    $(document).ready(function() {
        $("#user-data-filter-{{ table_id }} input[type=checkbox]").change(function() {
            $.ajax({
                type: "POST",
                data: {grid_name: "{{ grid_name }}", filter_level: $(this).data("filter-level"),
                       checked: $(this).is(":checked")},
                url: "{% url 'set_user_data_grid_config' %}",
                headers: {"X-CSRFToken": Cookies.get("csrftoken")},
                success: function() {
                    $("#{{ table_id }}").DataTable().ajax.reload(null, false);
                }
            });
        });
    });
</script>
