<!-- Needs plotly and plotly_helpers included -->
{% load js_tags %}
<script>
$(document).ready(function() {
    let enrichment_kits_over_time = {{ enrichment_kits_over_time | jsonify }};
    let enrichment_kit_labels = {{ enrichment_kit_labels | jsonify }};
    let series_colors = {{ series_colors | jsonify }};
    let title = "{{ title }}";

    let container = 'enrichment_kits-by-time-{{ uuid }}';
    // Inside a carousel the inactive slide is display:none, so measure the nearest visible ancestor
    let width = $(`#${container}`).closest(':visible').width();

    showStackedBar(container, title, width, $(`#${container}`).height(), enrichment_kits_over_time, enrichment_kit_labels, series_colors)
});
</script>
<!-- Plotly sets height:100% on its inner .plot-container, so the div needs the graph's size -->
<div id='enrichment_kits-by-time-{{ uuid }}' style="height: 500px"></div>
{% if collapsed_help %}<div class="text-muted small text-center">{{ collapsed_help }}</div>{% endif %}
