{% extends "uicore/page/base.html" %}
{% load static %}
{% load js_tags %}
{% block title %}Variant Diffs{% endblock %}
{% block head %}
<script src="{% static 'js/vc_diff.js' %}"></script>
<script>
    let records = {{ records_json | jsonify }};

    EKeys.load().then(keys => {
        $(function() {
            let diff = new Diff(
                records,
                $('#diff'),
                keys,
                {
                    userId: '{{user.id}}'
                },
                {copiedOnly: {{ copied_only|jsonify }}}
            );
            diff.render();
        });
    });
    
</script>
{% endblock %}

{% block content %}
    <div class="container">
        {% load ui_help %}
        {% page_help 'classification/diff_help' 'Classification Records Diff' %}
    </div>
    <div class="container-fluid">
        <div id="diff"></div>
    </div>
{% endblock content %}
