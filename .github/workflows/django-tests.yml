name: Django Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'claude/**'
      - '.github/ISSUE_TEMPLATE/**'

# Push bursts coalesce rather than each triggering a run: on master (no cancel)
# GitHub keeps one running plus at most one pending run per group, replacing the
# pending run as newer pushes land - a burst during a ~25 min run costs 2 runs
# total. PR branches instead cancel the superseded run for fast feedback.
concurrency:
  group: django-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        # POSTGRES_USER/PASSWORD/DB match the defaults in
        # variantgrid/settings/components/secret_settings.py so
        # config/ci/settings_config.json needs no DB section
        image: postgres:16
        env:
          POSTGRES_USER: snpdb
          POSTGRES_PASSWORD: snpdb
          POSTGRES_DB: snpdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snpdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

      redis:
        # Celery result backend - tests that wait on task results talk to it directly
        # (the Django cache is locmem under UNIT_TEST, this is only for Celery)
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DJANGO_SETTINGS_MODULE: variantgrid.settings.env.github_actions
      SETTINGS_CONFIG: ${{ github.workspace }}/config/ci/settings_config.json

    steps:
      - uses: actions/checkout@v4

      - name: Start installing tabix
        # The bgzip/tabix binaries the VCF import split stage runs (variantgrid/tests/test_tool_version_checks.py),
        # only needed by the test step - so apt runs in the background, behind the Python install, js_reverse and
        # the database restore. Everything else the build needs (zlib headers for the bgzip sdist) is in the image.
        run: |
          (sudo NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive sh -c \
             'apt-get update -qq && apt-get install -y -qq --no-install-recommends tabix'
           echo $? > apt.status) < /dev/null > apt.log 2>&1 &

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate js_reverse static file
        # django-compressor resolves it from STATIC_ROOT when rendering templates;
        # deploys generate it via the upgrader, a fresh checkout doesn't have it
        run: .venv/bin/python manage.py collectstatic_js_reverse

      - name: Restore migrated test database
        # Building the test database from the migrations is half the job (~3 min of ~6), and the result only
        # changes when a migration, an installed package or what the runner seeds does - so it is cached on those
        id: test-db
        uses: actions/cache@v4
        with:
          path: test_snpdb.dump
          key: test-db-v1-${{ hashFiles('*/migrations/*.py', '*/fake_data.py', 'variantgrid/test_runner.py', 'requirements.txt', 'requirements-dev.txt') }}
          # On a miss, the newest dump from an older key: --keepdb then applies only the migrations added since, and the
          # runner rebuilds it from scratch if it holds migrations that aren't on disk (another branch's)
          restore-keys: test-db-v1-

      - name: Load cached test database
        # Any restored dump, exact or from restore-keys (actions/cache only outputs cache-hit, true for an exact match)
        if: hashFiles('test_snpdb.dump') != ''
        # pg_restore from the service container, so client and server versions always match
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U snpdb test_snpdb
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U snpdb --no-owner -d test_snpdb < test_snpdb.dump
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}

      - name: Wait for tabix
        run: |
          while [ ! -f apt.status ]; do sleep 1; done
          cat apt.log
          exit "$(cat apt.status)"

      - name: Run unit tests
        # data/ is PRIVATE_DATA_ROOT (untracked) - some upload tests write output files there
        # --parallel 4: the runner clones the test DB per worker; the whole suite ran clean this way
        # on vg-test2 in ~2 min (claude/guides/testing.md#running-tests)
        # --keepdb: uses the cached database when one was loaded (the tests run in the per-worker clones,
        # so test_snpdb itself only ever holds the migrations and the runner's seed) and leaves it to dump
        run: |
          mkdir -p data media_root
          .venv/bin/python manage.py test --parallel 4 --keepdb

      - name: Dump test database for the cache
        if: steps.test-db.outputs.cache-hit != 'true'
        run: docker exec "$POSTGRES_CONTAINER" pg_dump -U snpdb -Fc test_snpdb > test_snpdb.dump
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
