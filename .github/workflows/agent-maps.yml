name: Agent maps

# claude/maps/*.md are generated by `scripts/vg map` and gitignored - generating them here proves they
# still render, and gives `vg docs check` the files its `claude/maps/...` citations point at. `vg docs
# check` then reports the path / path:Symbol citations in the agent docs that no longer resolve. It is
# a warning, not a gate: a dead citation means a doc has drifted behind the code, which is for whoever
# next works in that app to fix, not a reason to redden a build. It needs Django importable but no
# database, so it runs on every push - including the docs-only pushes that django-tests.yml skips.
# The import checks are gates: `lint-imports` holds the contracts in .importlinter and `vg imports cycles`
# fails on any cycle among module-load imports. Pylint errors (E-class only) are reported like the citations:
# a warning annotation on each line and the count in the job summary, failing only if pylint itself can't run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: agent-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: variantgrid.settings.env.github_actions
      SETTINGS_CONFIG: ${{ github.workspace }}/config/ci/settings_config.json

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate agent maps
        run: .venv/bin/python manage.py vg map

      - name: Check doc citations resolve
        continue-on-error: true
        run: .venv/bin/python scripts/vg docs check

      - name: Check import contracts
        run: uvx --from import-linter lint-imports --config .importlinter

      - name: Check for import cycles
        run: .venv/bin/python scripts/vg imports cycles

      - name: Report pylint errors
        continue-on-error: true
        run: |
          status=0
          PATH="$PWD/.venv/bin:$PATH" scripts/linting/run_pylint.sh --errors-only --jobs=0 \
            --msg-template='{path}:{line}:{column}: {msg_id}: {msg} ({symbol})' > pylint_errors.txt || status=$?
          grep -E '^[^ ]+:[0-9]+:[0-9]+: E[0-9]{4}' pylint_errors.txt > pylint_error_lines.txt || true
          sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::warning file=\1,line=\2,col=\3,title=pylint::\4/' pylint_error_lines.txt
          {
            echo "### pylint errors: $(wc -l < pylint_error_lines.txt)"
            echo '```'
            cat pylint_error_lines.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 1 is a fatal message, 32 a usage error: pylint did not finish, so the count above means nothing
          if (( status & 33 )); then cat pylint_errors.txt; exit 1; fi
