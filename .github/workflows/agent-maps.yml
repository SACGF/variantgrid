name: Agent maps

# claude/maps/*.md are generated by `scripts/vg map` and gitignored - generating them here proves they
# still render, and gives `vg docs check` the files its `claude/maps/...` citations point at. The check
# that matters is `vg docs check`: a path or path:Symbol citation in the agent docs that no longer
# resolves fails the build. It needs Django importable but no database, so it runs on every push -
# including the docs-only pushes that django-tests.yml skips.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: agent-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: variantgrid.settings.env.github_actions
      SETTINGS_CONFIG: ${{ github.workspace }}/config/ci/settings_config.json

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Generate agent maps
        run: .venv/bin/python manage.py vg map

      - name: Check doc citations resolve
        run: .venv/bin/python scripts/vg docs check
