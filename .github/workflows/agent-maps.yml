name: Agent maps

# claude/maps/*.md are generated by `scripts/vg map` and committed. This job regenerates them and
# fails when the committed copy is stale, the way `makemigrations --check` does for migrations.
# It needs Django importable but no database, so it runs on every push - including the
# docs-only pushes that django-tests.yml skips.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: agent-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: variantgrid.settings.env.github_actions
      SETTINGS_CONFIG: ${{ github.workspace }}/config/ci/settings_config.json

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Check committed maps are current
        run: .venv/bin/python manage.py vg map --check
