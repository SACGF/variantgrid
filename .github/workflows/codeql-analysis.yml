name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 17 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results
        upload: failure-only

    # A rule stays on everywhere except the files where it has only ever raised false positives - a
    # dismissal there only holds until the flagged line moves.
    # clear-text-storage: guesses "private" from names - PED export writes sample/sex/family, and the secret
    # key file is where the generated key is meant to live
    - name: Filter SARIF
      uses: advanced-security/filter-sarif@v1.1
      with:
        patterns: |
          -pedigree/models.py:py/clear-text-storage-sensitive-data
          -library/django_utils/django_secret_key.py:py/clear-text-storage-sensitive-data
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{ matrix.language }}"
