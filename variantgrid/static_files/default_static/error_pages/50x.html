<!DOCTYPE html>
<!-- From  https://better-error-pages.statuspage.io/ -->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="/static/js/lib/bootstrap/4.5.2/css/bootstrap.min.css">
        <link href="/static/css/branding.css" rel="stylesheet">
        <style>
            body {
                background-color: #ddd;
            }
            #maintenance-icon {
                width:100%;
                height:160px;
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center,center;
            }
            .fade-in {
                animation: fadeIn ease 2s;
                -webkit-animation: fadeIn ease 2s;
                -moz-animation: fadeIn ease 2s;
                -o-animation: fadeIn ease 2s;
                -ms-animation: fadeIn ease 2s;
            }
            @keyframes fadeIn {
                0% {opacity:0;}
                100% {opacity:1;}
            }
        </style>
    </head>
    <body>
        <div class="container mt-4">
            <div class="jumbotron bg-theme fade-in">
                <div id="maintenance-icon" class="navbar-brand"></div>
                <h1 id="site-name"></h1>
                <p class="lead">is down for maintenance.</p>
                <hr class="my-4">
                <p>Please try again shortly.</p>
            </div>
        </div>
    </body>
</html>
