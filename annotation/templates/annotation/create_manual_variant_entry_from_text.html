{% extends "uicore/page/base.html" %}
{% block title %}Create Variant{% endblock %}
{% block content %}
    <div class="container">
        <h3>Create Variant</h3>
        <form method="post">
            {% csrf_token %}
            <p>
                <code>{{ variants_text }}</code> is not in the database for {{ genome_build }}.
                Creating it adds the variant and annotates it.
            </p>
            <button class="btn btn-primary"><i class="fas fa-plus-circle"></i> Create and annotate variant</button>
        </form>
    </div>
{% endblock %}
