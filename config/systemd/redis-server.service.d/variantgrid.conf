# Drop-in for the distribution's redis unit: copy to /etc/systemd/system/redis-server.service.d/
# (redis.service.d/ on RHEL), then systemctl daemon-reload and restart redis.
# Redis is often the largest single process, so the kernel OOM killer picks it first - and with it go the
# cache, the locks and every in-flight task's results. Make it pick a celery worker instead, whose step fails
# alone and can be retried (#2187).
[Service]
OOMScoreAdjust=-900
