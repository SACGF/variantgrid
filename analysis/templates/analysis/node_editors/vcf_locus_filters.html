{% if vcf %}
{% load js_tags %}
<div id='vcf-locus-filters' vcf_id='{{ vcf.pk }}'>
<script>
    var vlf_descriptions = {{ vlf_descriptions | jsonify }};
    
    function checkShowingAll() {
        var vlf_table = $("#vcf-filter-table");
        var anyChecked = $("input[type=checkbox]", vlf_table).is(":checked");
        if (anyChecked) {
            $("#showing-all-filters").hide();
        } else {
            $("#showing-all-filters").show();
        }
    }    
    
    function showVCFFilters(show) {
        $("#no-filters").hide();
        $("#vcf-filters").show();
        checkShowingAll();
    }

    function hideVCFFilters(show) {
        $("#no-filters").show();
        $("#vcf-filters").hide();
    }
    
    $(document).ready(function() {
        {% if has_filters_set %}
            showVCFFilters();
        {% else %}
            hideVCFFilters();
        {% endif %}

        var vlf_table = $("#vcf-filter-table");
        $("input[type=checkbox]", vlf_table).each(function() {
            var name = $(this).attr("name");
            var description = vlf_descriptions[name];
            var row = $(this).closest("tr");
            $("<td></td>").text(description).appendTo(row);
        });
        
        $("#vcf-filters-all").change(function() {
            var checked_value = $(this).is(":checked");
        
            $("input[type=checkbox]", vlf_table).each(function() {
                $(this).prop('checked', checked_value);
            });
        });

        // Put this after all filters check
        $("input[type=checkbox]", vlf_table).change(checkShowingAll);
    });
    
</script>
<div class="editor-row editor-row-top">
<span class="editor-label">VCF filters</span>
{% if has_filters %}
<span id='no-filters'>Showing all variants <a class="hover-link" href='javascript:showVCFFilters()'>Select filters</a></span>
<div id='vcf-filters'>
    <span id='showing-all-filters'>Showing all variants <a class="hover-link" href='javascript:hideVCFFilters()'>Hide filters</a></span>
    <form>
    <table id='vcf-filter-table' class="editor-table vcf-filter-table">
    <tr><td><td><input id='vcf-filters-all' type='checkbox' title="(De)select all" /><td class="editor-table-help">(De)select all - no filters shows all results
    {{ vlf_form.as_table }}
    </table>
    </form>
</div>
{% else %}
    <span class="editor-help">No filters, showing all variants</span>
{% endif %}
</div>
</div>
{% endif %}
