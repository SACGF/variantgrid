<li class="list-group-item node-count-filter cursor-move {{ nc.css_classes }}" id="{{ nc.pk }}" node_count_id="{{ nc.pk }}">{% if nc.tag_id %}<span class="grid-tag tagged-{{ nc.tag_id }}" title="Tag: {{ nc.tag_id }}"><span class="user-tag-colored">{{ nc.tag_id }}</span></span>{% else %}<div class='user-tag-colored legend-color-box'></div><div class='legend-label'>{{ nc.description | safe }}</div>{% endif %}<div class='clear'></div></li>
