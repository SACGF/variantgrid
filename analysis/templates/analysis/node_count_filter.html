<li class="list-group-item node-count-filter{% if has_write_permission %} cursor-move{% endif %} {{ nc.css_classes }}" id="{{ nc.pk }}" node_count_id="{{ nc.pk }}">{% if nc.tag_id %}<span class="grid-tag tagged-{{ nc.tag_id }}" title="Tag: {{ nc.tag_id }}"><span class="user-tag-colored"><i class="fa-solid fa-tag tag-icon"></i>{{ nc.tag_id }}</span></span>{% else %}<div class='user-tag-colored legend-color-box'></div><div class='legend-label'>{{ nc.description | safe }}</div>{% endif %}<div class='clear'></div></li>
