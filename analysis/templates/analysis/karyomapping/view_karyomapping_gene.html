{% load static %}
{% load js_tags %}
<script type="text/javascript" src="{% static 'js/lib/plotly-custom-3.7.0.min.js' %}"></script>
<script src="{% static 'js/analysis/view_karyomapping_gene.js' %}"></script>
<script>
    $(document).ready(function() {
        showKaryotypeScatter({{ karyotype_bin_scatter_data|jsonify }}, {{ karyotype_bin_labels|jsonify }}, {
            probandSample: {{ kag.karyomapping_analysis.proband.sample|stringformat:"s"|jsonify }},
            geneSymbol: {{ kag.gene_symbol|stringformat:"s"|jsonify }},
            strand: {{ strand|stringformat:"s"|jsonify }},
            upstreamKb: {{ kag.upstream_kb|jsonify }},
            downstreamKb: {{ kag.downstream_kb|jsonify }},
            iv: {{ iv|stringformat:"s"|jsonify }},
        });
    });
</script>
<div>
    <p>
    <div id='karyotype-graph'></div>
    <div id='karyotype-data'>
        <div id='csv-download-container'>
            <a class='csv-download-link' title='Download CSV' href="{% url 'download_karyomapping_gene_csv' kag.pk %}">
                <div class='csv-icon icon32 left'></div>
                <div class='left'>Download as CSV</div>
                <div class='clear'></div>
            </a>
        </div>

        <div>
        <table>
            <tr><th>Name <th>Count
        {% for kb, count in karyotype_bin_counts.items %}
            <tr><td> {{ kb }} <td> {{ count }} </tr>
        {% endfor %}
        </table>
        </div>
    </div>

</div>
