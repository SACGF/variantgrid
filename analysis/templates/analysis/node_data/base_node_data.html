{% block top %}{% endblock top %}

<style>
	{% block css %}{% endblock css %}
</style>

<script type="text/javascript">
    function errorListItem(msg) {
        const $li = $("<li>", { class: "error" });

        if (msg?.startsWith("Analysis:")) {
            $li.append(document.createTextNode(msg));
            $li.append(
                $("<div>").append(
                    $("<div>", { class: "left", css: { marginRight: 2 }, text: "Fix this in " }),
                    $("<a>", { href: "javascript:analysisSettings()" }).append(
                        $("<div>", { class: "left icon16 settings-icon" }),
                        $("<div>", { class: "left", text: "Analysis settings" })
                    ),
                    $("<div>", { class: "clear" })
                )
            );
        } else if (msg && msg.includes(": Traceback (")) {
            $li.append($("<pre>", { text: msg }));
        } else {
            $li.text(msg);      // auto‑escapes < > &
        }
        return $li;
    }

    /* Add to whatever is already showing, so an editor failure doesn't hide the node errors that caused it */
    function add_errors(errors) {
        console.log("add_errors:", errors);
        const $container = $("#error-container");
        let $list = $("ul.messages", $container);
        if ($list.length === 0) {
            $container.append($("<div>", { text: "Node errors:" }));
            $list = $("<ul>", { class: "messages" }).appendTo($container);
        }
        errors.forEach(msg => $list.append(errorListItem(msg)));
        $container.show();
    }

    function on_error_function(errors) {
        hideLoadingOverlay();
        $("#node-data-container").empty();
        $("#error-container").empty();
        add_errors(errors);
    }


	function load_node_editor(node_edit_url, unique_code) {
	    $("#node-editor-container").empty();
        $.ajax(node_edit_url, {
            suppressErrors: true,
            success: function(html) {
                if (unique_code && $("#" + unique_code, "#node-data-container").length === 0) {
                    return;  // user navigated away; ignore stale response
                }
                $("#node-editor-container").html(html);
            },
            error: function(xhr, error) {
                let message = "Error Loading Node Editor. Status: " + xhr.status + ". ";
                if (xhr.status >= 500) {
                    message += "Internal server error";
                } else if (xhr.status >= 400) {
                    message += "Error retrieving data - perhaps try reloading node?";
                }
                hideLoadingOverlay();
                add_errors([message]);
            }
        });
	}
	{% block javascript %}{% endblock javascript %}
	
	$(document).ready(function() {
		$("#error-container").empty();
	    {% block docreadyjs %}{% endblock docreadyjs %}
	});
</script>

{% block content %}
{% endblock content %}
