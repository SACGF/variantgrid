# Supply-chain cooldown: uv never resolves or installs a release uploaded in the last 7 days, since most
# malicious PyPI uploads are pulled within days (#1165). This applies to `uv pip install` on deployments too.
exclude-newer = "7 days"

# Packages we publish ourselves are exempt, so a new release can be picked up straight away.
# Their dependencies still get the cooldown. One-off on the command line: --exclude-newer-package <name>=false
# certifi, pillow and pypdf carry security fixes inside the cooldown, so they get a fixed cutoff that admits them; this
# freezes them at that date, so remove each entry once the default 7 days has passed it (certifi and pillow after
# 2026-10-28, pypdf after 2026-10-29).
exclude-newer-package = { cdot = false, certifi = "2026-10-21T00:00:00Z", pillow = "2026-10-21T00:00:00Z", pypdf = "2026-10-22T00:00:00Z" }
